name: PantryPilot CI/CD Pipeline

# Triggers: Run workflow on pushes or pull requests to main/master branches
'on':
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Backend Automated Pytest Suite
  # ---------------------------------------------------------------------------
  backend-ci:
    name: Backend Pytest & Health Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Backend Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pydantic[email]" email-validator
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Backend Pytest Suite
        env:
          DATABASE_URL: "sqlite:///./test_ci.db"
          SECRET_KEY: "test_secret_key_ci_cd_pantrypilot"
          ALGORITHM: "HS256"
          GEMINI_API_KEY: "test_dummy_gemini_key"
          MINIO_ENDPOINT: "localhost:9010"
          MINIO_ACCESS_KEY: "minioadmin"
          MINIO_SECRET_KEY: "minioadmin"
          REDIS_URL: "redis://localhost:6379"
        run: |
          pytest backend/tests -v

  # ---------------------------------------------------------------------------
  # Job 2: Frontend React Production Build Validation
  # ---------------------------------------------------------------------------
  frontend-ci:
    name: Frontend React Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20 Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Node Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Compile Production Frontend Assets
        working-directory: ./frontend
        run: npm run build

  # ---------------------------------------------------------------------------
  # Job 3: Docker Multi-Container Build Verification
  # ---------------------------------------------------------------------------
  docker-ci:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    steps:
      - name: Checkout Repository Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx Builder
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: pantrypilot-backend:latest

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: pantrypilot-frontend:latest
